services:
  api:
    build: .
    container_name: langbook
    ports: 
      - "8000:8000"
    restart: unless-stopped
    environment: 
      - FRONTEND_DIR=/code/app/frontend
  translator:
    image: libretranslate/libretranslate
    container_name: translator
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      LT_LOAD_ONLY: "ru,en,fr"            # only load the languages you need
    volumes:
      - lt-models:/home/libretranslate/.local
    # note: no "ports:" section, on purpose

volumes:
  lt-models: