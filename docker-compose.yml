services:
  db:
    image: postgres:16
    container_name: langbook-db
    restart: unless-stopped
    command: ["postgres", "-c", "port=5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    container_name: langbook-api
    restart: unless-stopped
    env_file: 
      - .env.docker
    environment:
      - FRONTEND_DIR=/code/app/frontend
    ports:
      - "8000:8000"
    volumes:
      - langbook_storage:/storage
    depends_on:
      db:
        condition: service_healthy
  translator:
    image: libretranslate/libretranslate
    container_name: translator
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      LT_LOAD_ONLY: "ru,en"
    volumes:
      - lt-models:/home/libretranslate/.local
  cleanup-worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PYTHONUNBUFFERED: "1"
      CLEANUP_INTERVAL_SECONDS: "300"
    command: ["python", "-u", "-m", "app.workers.cleanup"]
    volumes:
      - langbook_storage:/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  langbook_storage:
  lt-models: