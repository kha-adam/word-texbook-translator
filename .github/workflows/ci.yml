
name: Langbook CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: langbook
          POSTGRES_PASSWORD: langbook_test_password
          POSTGRES_DB: langbook-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U langbook -d langbook-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://langbook:langbook_test_password@localhost:5432/langbook-test
      JWT_SECRET_KEY: ci-only-test-secret-not-for-production
      STORAGE_DIR: storage_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
        
      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .
