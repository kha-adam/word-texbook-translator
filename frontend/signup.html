<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E2001A">
    <title>Sign up · Langbook</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="brand" href="/login">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>
                <span class="brand-name">Langbook</span>
                <span class="brand-tag">Notes in the margin</span>
            </span>
        </a>
        <h1>Start a library</h1>
        <div id="signupContainer">
            <label class="field">
                <span>Email</span>
                <input id="signupEmail" type="email" autocomplete="email" placeholder="you@insa-toulouse.fr">
            </label>
            <label class="field">
                <span>Password</span>
                <input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters">
            </label>
            <label class="field">
                <span>Confirm password</span>
                <input id="signupPasswordConf" type="password" autocomplete="new-password" placeholder="Repeat password">
            </label>
            <button class="btn" id="signupSubmit" type="button">Create account</button>
            <p id="signupError" class="form-error"></p>
        </div>
        <p class="auth-foot">Already have an account? <a href="/login">Log in</a></p>
    </main>
    <script type="module" src="/src/signup.ts"></script>
</body>
</html>
