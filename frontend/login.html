<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E2001A">
    <title>Log in · Cinabre</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="brand" href="/login">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>
                <span class="brand-name">Cinabre</span>
                <span class="brand-tag">Notes in the margin</span>
            </span>
        </a>
        <h1>Welcome back</h1>
        <div id="loginContainer">
            <label class="field">
                <span>Email</span>
                <input id="loginEmail" type="email" autocomplete="email" placeholder="you@insa-toulouse.fr">
            </label>
            <label class="field">
                <span>Password</span>
                <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password">
            </label>
            <button class="btn" id="loginSubmit" type="button">Log in</button>
            <p id="loginError" class="form-error"></p>
        </div>
        <p class="auth-foot">New here? <a href="/signup">Create an account</a></p>
    </main>
    <script type="module" src="/src/login.ts"></script>
</body>
</html>
